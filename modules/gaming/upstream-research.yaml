schema: 1
reviewed_at: 2026-08-25
physical_review_at: 2026-10-01
physical_record: docs/g14-study-2026-10-01.md
hardware_scope:
  system: ASUS ROG Zephyrus G14 GA402RK-L8149
  cpu: AMD Ryzen 9 6900HS
  gpu: AMD Radeon 680M plus Radeon RX 6800S
  controllers:
    - original Steam Controller
    - Steam Deck

reintroduction_policy:
  requires_explicit_user_confirmation: true
  reason: Removed power and gaming components can conflict with the single-owner baseline or add privileged failure modes.
  prompt_template: "Are you sure you want to reintroduce COMPONENT? It was removed because PRIOR_RATIONALE. The changed evidence is CHANGED_EVIDENCE; remaining risks are RISKS."
  gates:
    cardwire:
      prior_rationale: Early eBPF-LSM GPU blocking adds a privileged switching authority and can deny GPU access.
      changed_evidence_required: A measured RX 6800S runtime-suspend failure remains after render-node holders and firmware modes are checked, and a stable Cardwire release explicitly solves that case.
    lact:
      prior_rationale: A resident GPU tuning daemon overlaps laptop firmware control and monitoring can prevent dGPU runtime suspend.
      changed_evidence_required: A measured dGPU power or thermal problem cannot be controlled through ASUS firmware, and a safe GA402-specific LACT configuration is validated on AC and battery.
    ryzenadj:
      prior_rationale: Direct SMU and /dev/mem writes drift against firmware policy and the former preset set only a temperature target, not a bounded power envelope.
      changed_evidence_required: The installed kernel and firmware expose no usable ASUS PPT controls, and conservative GA402 limits have been measured and recovery-tested.
    ogc_kernel:
      prior_rationale: No required out-of-tree patch was identified; replacing distro kernels increases packaging, update, and UKI risk.
      changed_evidence_required: A specific GA402 or Gamescope regression is documented and fixed only by a named patch absent from both current stock kernels.
    gamemode:
      prior_rationale: Its governor and platform-profile actions overlap asusd and no local benefit was measured.
      changed_evidence_required: Repeatable per-game frame-time data shows a benefit with all overlapping power/profile actions disabled.

