    areas:
      - README.md
      - alhp-keyring AUR package
      - alhp-mirrorlist AUR package
    adopted:
      - CPU-gated x86-64-v3 core, extra, and multilib overlays on Arch
      - repository ordering directly before each official Arch fallback
      - ALHP keyring and mirrorlist AUR packages through their signed Chaotic-AUR builds
    rejected:
      - x86-64-v4 on the Ryzen 9 6900HS
      - treating compiler flags as proof of a gaming, thermal, or battery benefit
    risks:
      - packages can lag official Arch while ALHP rebuilds large transitions
      - ALHP kernel pkgrel breaks directly linked module packages; DKMS variants are unaffected

